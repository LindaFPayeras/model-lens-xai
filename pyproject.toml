[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lens-xai"
version = "0.1.0"
description = "Comparative explainability and evaluation of deep learning models"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.2",
    "captum==0.9.0",
    "grad-cam==1.5.7",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scipy==1.15.3",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "Pillow==12.3.0",
    "codecarbon==3.3.2",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
